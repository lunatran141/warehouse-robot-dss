name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -f docker/Dockerfile
          test -f docker-compose.yml
          test -f model/WarehouseRobot.nlogox
          test -f experiments/experiments.xml
          test -f scripts/run-experiments.sh

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker compose build

      - name: Run NetLogo smoke test
        run: |
          chmod +x scripts/run-experiments.sh
          ./scripts/run-experiments.sh

      - name: Verify experiment result
        run: test -s experiments/results/smoke-test.csv

      - name: Upload smoke-test result
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-result
          path: experiments/results/smoke-test.csv
          if-no-files-found: error